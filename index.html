function bindLanguage(){document.getElementById('en').onclick=()=>setLang('en');document.getElementById('hu').onclick=()=>setLang('hu')}
function setLang(l){if(l===lang)return;let hint=document.getElementById('hint');if(hint&&hint.value.trim())hints[idx]=hint.value.slice(0,600);lang=l;document.documentElement.lang=l;render()}
function interlude(){const texts=lang==='hu'?{5:['🔮','A MÚLT CSAK A KEZDET','Most Beauty néhány titkot is elárul… 😈'],10:['💋','FELOLDVA: A PAJKOS FEJEZET','Még öt kérdés. És talán néhány merész vallomás… 🔥']}:{5:['🔮','THE PAST IS ONLY THE BEGINNING','Now comes the part where Beauty reveals a few secrets… 😈'],10:['💋','UNLOCKED: THE NAUGHTY CHAPTER','Five more questions. And perhaps a few dangerous confessions… 🔥']};const t=texts[idx];app.innerHTML=`${switcher()}<div class="eyebrow">${T().chapter}</div><div class="secret">${t[0]}</div><h2 class="secret-title">${t[1]}</h2><p class="secret-note">${t[2]}</p><button class="btn secret-btn" id="unlock">${T().unlock}</button>`;bindLanguage();document.getElementById('unlock').onclick=()=>{interludeSeen[idx]=true;render()}}
function render(){fill.style.width=`${Math.max(0,idx)/questions.length*100}%`;if(idx===-1){app.innerHTML=`${switcher()}<div class="eyebrow">${T().private}</div><h1>HEY BEAUTY… 😈❤️</h1><p class="sub">${T().subtitle}</p><p>${T().intro}</p><div class="feedback"><b>${T().before}</b><p>${T().consent}</p></div><div class="choices"><button class="choice" id="yes">${T().share}</button><button class="choice" id="no">${T().alone}</button></div><p class="muted">${T().warning}</p>`;bindLanguage();document.getElementById('yes').onclick=()=>begin(true);document.getElementById('no').onclick=()=>begin(false);return}if(idx>=questions.length){finale();return}if((idx===5||idx===10)&&!interludeSeen[idx]){interlude();return}const q=Q(idx);app.innerHTML=`${switcher()}<div class="eyebrow">${T().question} ${idx+1} ${T().of} ${questions.length}</div><div class="stage">${idx<5?T().memories:idx<10?T().temptations:T().reveal}</div><h2>${escapeHtml(q.title)}</h2><p>${escapeHtml(q.prompt)}</p><div class="choices" id="choices">${q.opts.map((o,i)=>`<button class="choice ${answers[idx]===i?'selected':''}" data-i="${i}" ${afterChoice?'disabled':''}><b>${String.fromCharCode(65+i)}.</b> ${nl(o)}</button>`).join('')}</div><div id="after"></div>`;bindLanguage();if(afterChoice){showAfter();return}document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>choose(+b.dataset.i))}
function begin(allow){shared=allow;sessionId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).slice(0,64);idx=0;render()}
function choose(n){if(afterChoice)return;answers[idx]=n;afterChoice=true;const q=questions[idx];void notify({event:'answer',question:idx+1,choice:n});if(q.correct!==undefined&&n===q.correct)sparkle(14);else if(idx===14)sparkle(20);render()}
function showAfter(){const q=questions[idx],n=answers[idx],lq=Q(idx);let msg='';if(q.correct!==undefined){msg=n===q.correct?T().correct:T().wrong+lq.opts[q.correct]+T().wrongEnd}else if(idx===13){msg=personalMessage}else if(idx===10&&n===4&&answers[5]===3){msg=T().contradiction}else{msg=[T().thanks,T().noted,T().smile][idx%3]};let more='';if(q.hintAt===n){more=`<p class="muted">${T().hint}</p><textarea class="hint" id="hint" maxlength="600" placeholder="${escapeHtml(T().placeholder)}">${escapeHtml(hints[idx]||'')}</textarea>`}document.getElementById('after').innerHTML=`<div class="feedback">${nl(msg)}</div>${more}<button class="btn" id="next">${idx===14?T().final:T().next}</button>`;document.getElementById('next').onclick=()=>{const h=document.getElementById('hint');if(h&&h.value.trim()){hints[idx]=h.value.trim().slice(0,600);void notify({event:'hint',question:idx+1,title:q.title,hint:hints[idx]})}afterChoice=false;idx++;render()}}
function finale(){const score=questions.reduce((s,q,i)=>s+(q.correct!==undefined&&answers[i]===q.correct?1:0),0),total=5;if(!finalSent){finalSent=true;const summary=questions.map((q,i)=>({question:i+1,choice:answers[i],hint:hints[i]||undefined}));void notify({event:'final',answers:summary,score,total});sparkle(25)}fill.style.width='100%';const list=questions.map((q,i)=>`<div class="answer"><strong>${i+1}. ${escapeHtml(Q(i).title)}</strong><br>${nl(Q(i).opts[answers[i]]||T().noAnswer)}${hints[i]?`<br><span class="muted">Hint: ${escapeHtml(hints[i])}</span>`:''}</div>`).join('');app.innerHTML=`${switcher()}<div class="eyebrow">${T().confessions}</div><h1 class="shimmer">${T().finalTitle}</h1><div class="score-big">${score}/${total} ✨</div><p>${T().survived}</p><p><span class="tag">${T().memory}: ${score}/${total}</span></p><p>${T().journey}</p><p><b>${T().badDay}</b></p><p>${T().far}</p><p class="note">${T().prediction}: <b>${escapeHtml(Q(5).opts[answers[5]])}</b>. ${T().yourChoice}</p><h2>${T().yourAnswers}</h2>${list}<p class="muted">${T().sharing}: ${shared?T().live:T().privatePlay}</p><label><input type="checkbox" id="consent"> ${T().copyConsent}</label><button class="btn" id="copy">${T().copy}</button> <button class="btn" id="again" style="margin-top:10px;background:#542442">${T().again}</button><p id="copyStatus" class="muted" aria-live="polite"></p>`;bindLanguage();document.getElementById('again').onclick=()=>{idx=-1;answers=[];hints={};interludeSeen={};shared=false;sessionId=null;finalSent=false;afterChoice=false;render()};document.getElementById('copy').onclick=async()=>{if(!document.getElementById('consent').checked){document.getElementById('copyStatus').textContent=T().tick;return}const t=`BEAUTY'S CONFESSIONS 💋\nMemory score: ${score}/${total}\n\n`+questions.map((q,i)=>`${i+1}. ${q.title}\n${q.opts[answers[i]]}${hints[i]?`\nHint: ${hints[i]}`:''}`).join('\n\n');try{await navigator.clipboard.writeText(t);document.getElementById('copyStatus').textContent=T().copied}catch{const ta=document.createElement('textarea');ta.value=t;app.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();document.getElementById('copyStatus').textContent=T().copiedMaybe}}}
render();
</script></body></html>
