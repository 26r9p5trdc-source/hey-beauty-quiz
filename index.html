<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hey Beauty 😈❤️</title><style>
:root{color-scheme:dark;--pink:#ff4c8b;--red:#9d153f;--bg:#100912;--card:#221326;--text:#fff0f5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#5d153c,transparent 48%),linear-gradient(145deg,#100912,#180b20 65%,#260d22);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100dvh}.wrap{max-width:640px;margin:auto;padding:28px 17px 55px}.panel{background:linear-gradient(145deg,#2b172e,#1a101e);border:1px solid #703250;border-radius:24px;padding:26px 21px;box-shadow:0 15px 55px #0008}h1{font-size:clamp(32px,9vw,53px);margin:10px 0;color:#ff8bb0;line-height:1.04}h2{font-size:25px;margin:12px 0 17px}p{line-height:1.6}.eyebrow{color:#f7a5c5;letter-spacing:.15em;font-weight:750;font-size:12px;text-transform:uppercase}.sub{color:#e5b9d0}.choices{display:grid;gap:11px;margin:22px 0}.choice{background:#361b39;border:1px solid #854364;color:#fff;padding:16px;text-align:left;border-radius:15px;font-size:15px;cursor:pointer;line-height:1.45}.choice:hover,.choice:focus-visible{border-color:#ff8cb7;background:#4b2245}.choice:disabled{opacity:.72;cursor:default}.choice.selected{border-color:#ff80ae;background:#673052}.btn{display:inline-block;border:0;border-radius:999px;padding:15px 23px;background:linear-gradient(110deg,#f83f85,#b91b5b);color:white;font-weight:800;cursor:pointer;font-size:15px}.btn:disabled{opacity:.5}.muted{color:#d8a9bf;font-size:13px}.feedback{padding:16px;border:1px solid #9d4c75;border-radius:16px;background:#451f3e;margin:15px 0;white-space:pre-line}.bar{height:7px;background:#49213e;border-radius:20px;overflow:hidden;margin-bottom:25px}.fill{height:100%;background:linear-gradient(90deg,#ec4481,#f6a4c5);transition:width .2s}.hide{display:none}.hint{width:100%;background:#160d1b;color:white;border:1px solid #8d5270;border-radius:12px;padding:14px;font:inherit;min-height:90px;resize:vertical}.answer{border-bottom:1px solid #65304c;padding:12px 0}.answer strong{color:#ff9fc3}label{display:flex;gap:10px;align-items:flex-start;margin:18px 0}.tag{display:inline-block;background:#59223f;padding:6px 11px;border-radius:50px;font-size:12px;color:#ffc6dc}.note{border-left:3px solid #fa669a;padding-left:12px}

body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(circle at 20% 35%,#bc22501f,transparent 32%),radial-gradient(circle at 80% 75%,#8c3aff17,transparent 36%);animation:glow 8s ease-in-out infinite alternate}.wrap{position:relative;z-index:1}.panel{position:relative;overflow:hidden;animation:appear .48s cubic-bezier(.2,.8,.2,1)}.panel:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,#ff4c8b,#bb79ff,transparent);opacity:.9}.choice{transition:transform .18s,border-color .18s,background .18s,box-shadow .18s}.choice:active{transform:scale(.975)}.choice.selected{box-shadow:0 0 22px #ff478844}.btn{box-shadow:0 8px 25px #f83f8540;transition:transform .18s,filter .18s}.btn:active{transform:scale(.97)}.feedback{animation:reveal .4s ease-out;box-shadow:0 0 28px #ef397f1c}.fill{transition:width .55s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 14px #ff4c8b}.spark{position:fixed;z-index:5;pointer-events:none;font-size:22px;animation:floatup 1.6s ease-out forwards}.secret{font-size:54px;text-align:center;filter:drop-shadow(0 0 22px #fa398f);animation:pulse 1.5s ease-in-out infinite alternate}.secret-title{text-align:center;letter-spacing:.13em;color:#ff9ac2}.secret-note{text-align:center;color:#eed1df}.secret-btn{display:block;margin:25px auto 5px}.shimmer{background:linear-gradient(95deg,#ff8bb0,#e3b8ff,#ff8bb0);background-size:200%;background-clip:text;-webkit-background-clip:text;color:transparent;animation:shine 5s linear infinite}.score-big{font-size:48px;font-weight:900;text-align:center;color:#ff9fc3;text-shadow:0 0 28px #fb4b8c66}.stage{color:#f9b2cf;font-size:12px;text-align:right;margin:-14px 0 15px;letter-spacing:.08em}@keyframes appear{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}@keyframes reveal{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@keyframes glow{to{opacity:.45;filter:hue-rotate(25deg)}}@keyframes pulse{to{transform:scale(1.13)}}@keyframes shine{to{background-position:200%}}@keyframes floatup{0%{opacity:0;transform:translateY(20px) scale(.5) rotate(-15deg)}20%{opacity:1}100%{opacity:0;transform:translateY(-135px) scale(1.3) rotate(25deg)}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="wrap"><div class="bar"><div class="fill" id="fill" style="width:0%"></div></div><section class="panel" id="app"></section></main><script>
const questions=[
{title:'The Very First Message 💌',prompt:'What was the very first message I sent you?',opts:['Hey gorgeous! I just had to tell you how beautiful you are! 😘','Hé Beauty! Just wanna say I love your nice pics! Really nice! 😘','Wow! Those pictures definitely caught my attention! 🔥',"Hi beautiful! I don't usually message strangers, but for you I'll make an exception! 😉"],correct:1},
{title:'Your First Reply 🥰',prompt:'And what did you say back?',opts:['Hey handsome! Thank you so much! 😘❤️','Hello 🤗 Thank you ☺️ you are nice ♥️',"Hi! Haha, you're making me blush! 🥰","Hello stranger! That's very sweet of you! 😉"],correct:1},
{title:'My Gentleman Era 😇',prompt:'How many sentences did I manage before asking about your piercings?',opts:['3rd sentence','5th sentence','8th sentence','12th sentence'],correct:1},
{title:'The Piercing Conversation 😈',prompt:'When I asked, “Mmm… what kinda off piercing do you consider”, what was your unforgettable answer?',opts:['Nipples 🙃☺️',"That's a secret… maybe I'll tell you later. 😉",'Pussy 🙃☺️',"Haha! Wouldn't you like to know? 😈"],correct:2},
{title:'My Very Subtle Reaction 😂',prompt:'What did I reply to that?',opts:["Wow… now that's something I'd love to see! 😏🔥","Are you serious? That sounds pretty exciting! 😘",'🙏\nLet it happen\nThat would be so hot','OMG Beauty! You\'re really full of surprises! 😈'],correct:2},
{title:'The Piercing Prediction 💎',prompt:'Two and a half years later… what is your prediction? Only your body, only your choice.',opts:['Within 3 months','Within 6 months','Within 2.5 years','Never'],kind:'choice'},
{title:'Our Next Special Evening 🌙',prompt:'Which evening would you enjoy most with me?',opts:['A romantic dinner, wine and eye contact','A playful, flirty adventure','A luxury hotel and wellness evening','A mystery date with surprises'],kind:'choice'},
{title:'A Weekend Together 🥂',prompt:'Pick your ideal weekend, Beauty.',opts:['Sweet & Romantic — dinner, a walk and cuddles','Naughty & Playful — a flirty game and lots of laughter','Luxury & Pleasure — wellness and a beautiful hotel','Surprise Me — a mystery weekend'],kind:'choice'},
{title:'Beauty’s Secret Wish 💋',prompt:'If you could make ONE secret wish come true with me, which would you choose?',opts:['The Romantic Escape — a hotel weekend','The Naughty Adventure — playful, flirty fun','The Unexpected Kiss — our first kiss','The Mystery Fantasy — something you haven’t revealed'],kind:'choice',hintAt:3},
{title:'Truth or Dare, Beauty? 🎲',prompt:'Which completely optional challenge sounds the most fun?',opts:['The Kiss Challenge — tell me where you would like a kiss','The Flirt Challenge — send a flirty message','The Secret Truth — share one cheeky thought','The Surprise Challenge — let me plan something romantic'],kind:'choice'},
{title:'One Night, Five Possibilities 🌹',prompt:'Which adventure would you choose, if you felt like it?',opts:['The Romantic Dinner','The Private Spa','The Naughty Game Night','The Mystery Adventure','The Piercing Adventure — visiting a professional studio, only if YOU want to'],kind:'choice'},
{title:'The Chemistry Test ⚡',prompt:'When you think about the chemistry between us, what goes through your mind?',opts:['Sweet Connection — friendship and warmth','Flirty Butterflies — that little spark','Dangerous Chemistry — attraction and curiosity','You Have No Idea… — thoughts I haven’t shared'],kind:'choice'},
{title:'Beauty’s Naughty Bucket List 🔥',prompt:'What would you add to our imaginary bucket list?',opts:['The Midnight Escape — a spontaneous hotel night','The Sensual Challenge — massages and flirting','The Daring Adventure — trying something new','The Secret Fantasy — a wish I haven’t revealed'],kind:'choice',hintAt:3},
{title:'Behind the Flirting & the Smiles ❤️',prompt:'What does our connection really mean to you, Szandi?',opts:["MY SAFE PLACE — You're someone I feel comfortable talking to, even when life gets difficult.","MY SPECIAL CONNECTION — You're more than someone I flirt with. I value our honesty and support.","MY SMILE ON A DIFFICULT DAY — You somehow make me smile, even on hard days.","A LITTLE BIT OF EVERYTHING — I can laugh, flirt and be vulnerable with you."],kind:'choice',sensitive:true},
{title:'Our Next Chapter ❤️',prompt:'If you could write the next chapter of our story, what would it look like?',opts:['ALWAYS MY SPECIAL FRIEND — keep sharing, supporting and laughing','MORE FLIRTING, MORE FUN — teasing and surprises','LET’S EXPLORE OUR CHEMISTRY — see where feelings take us, no pressure','LET’S MAKE SOME MEMORIES — meet and create adventures','OUR STORY, OUR WAY — discover it together, one step at a time'],kind:'choice'}
];
const app=document.getElementById('app'),fill=document.getElementById('fill');let idx=-1,answers=[],hints={},shared=false,selected=null,interludeSeen={},sessionId=null,deliveryErrors=0;const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const nl=s=>escapeHtml(s).replace(/\n/g,'<br>');async function notify(payload){if(!shared)return;try{const r=await fetch('/.netlify/functions/telegram',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...payload,sessionId})});if(!r.ok)deliveryErrors++}catch(e){deliveryErrors++}}
function sparkle(count=12){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<count;i++){let e=document.createElement('span');e.className='spark';e.textContent=['💋','✨','❤️','😈','💖'][i%5];e.style.left=(10+Math.random()*80)+'vw';e.style.top=(35+Math.random()*45)+'vh';e.style.animationDelay=(Math.random()*.35)+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}}function interlude(){const texts={5:['🔮','THE PAST IS ONLY THE BEGINNING','Now comes the part where Beauty reveals a few secrets… 😈'],10:['💋','UNLOCKED: THE NAUGHTY CHAPTER','Five more questions. And perhaps a few dangerous confessions… 🔥']};const t=texts[idx];app.innerHTML=`<div class="eyebrow">Secret chapter unlocked</div><div class="secret">${t[0]}</div><h2 class="secret-title">${t[1]}</h2><p class="secret-note">${t[2]}</p><button class="btn secret-btn" id="unlock">Unlock next chapter →</button>`;document.getElementById('unlock').onclick=()=>{interludeSeen[idx]=true;render()};sparkle(9)}function render(){fill.style.width=`${Math.max(0,idx)/questions.length*100}%`;if(idx===-1){app.innerHTML=`<div class="eyebrow">A private little adventure</div><h1>HEY BEAUTY… 😈❤️</h1><p class="sub">How well do you remember us… and what happens next?</p><p>15 questions, a few secrets and a little mystery.</p><div class="feedback"><b>Before we begin, Beauty ❤️</b><p>This quiz includes personal and flirty questions. If you agree, your answers will be sent to the quiz creator via Telegram <b>as you answer each question</b>, and a summary will be sent at the end. Optional hints are included if you write them. You can instead play privately, with no answers sent. You can stop anytime.</p></div><div class="choices"><button class="choice" id="yes">❤️ Play & share my answers live</button><button class="choice" id="no">🔒 Play privately — send nothing</button></div><p class="muted">You can change your mind by restarting the quiz. Telegram messages already sent cannot be recalled.</p>`;document.getElementById('yes').onclick=()=>begin(true);document.getElementById('no').onclick=()=>begin(false);return}if(idx>=questions.length){finale();return}if((idx===5||idx===10)&&!interludeSeen[idx]){interlude();return}const q=questions[idx];selected=null;app.innerHTML=`<div class="eyebrow">Question ${idx+1} of ${questions.length}</div><div class="stage">${idx<5?'THE MEMORIES':idx<10?'THE TEMPTATIONS':'THE REVEAL'}</div><h2>${escapeHtml(q.title)}</h2><p>${escapeHtml(q.prompt)}</p><div class="choices" id="choices">${q.opts.map((o,i)=>`<button class="choice" data-i="${i}"><b>${String.fromCharCode(65+i)}.</b> ${nl(o)}</button>`).join('')}</div><div id="after"></div>`;document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(+b.dataset.i))}
function begin(allow){shared=allow;sessionId=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).slice(0,64);idx=0;render()}
function choose(n){if(selected!==null)return;selected=n;const q=questions[idx];answers[idx]=n;void notify({event:"answer",question:idx+1,title:q.title,answer:q.opts[n]});document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(+b.dataset.i===n)b.classList.add('selected')});let msg='';if(q.correct!==undefined){msg=n===q.correct?'💋 CORRECT, BEAUTY!\nYour memory is dangerously good. 😈😘':`😏 OOPS, BEAUTY!\nThe correct answer was: ${q.opts[q.correct]}\nDon't worry, I still think you're adorable. 💋`;}else if(idx===13){msg="❤️ Thank you for being honest, Beauty. Behind all my teasing and naughty jokes, I genuinely value our laughter, our honesty and how we can talk on difficult days. Even when you're having a bad day, you're still my Beauty. ❤️ And yes… I still have a reputation to maintain as the guy who asked about piercings after just FIVE sentences! 😂😈😘";}else if(idx===10&&n===4&&answers[5]===3){msg="😈 Beauty! You said 'never' to the piercing… and now you're picking the piercing adventure? 😂 No pressure, of course. Your body, your decision. ❤️";}else{msg=['Ooh, interesting choice, Beauty! 😏','Noted… with a very mischievous smile. 😈','I like learning what makes you smile. ❤️'][idx%3]}if(q.correct!==undefined&&n===q.correct)sparkle(14);else if(idx===14)sparkle(20);let more='';if(q.hintAt===n){more=`<p class="muted">Want to leave me a little hint? Totally optional.</p><textarea class="hint" id="hint" placeholder="Give me a little hint, Beauty…"></textarea>`}document.getElementById('after').innerHTML=`<div class="feedback">${nl(msg)}</div>${more}<button class="btn" id="next">${idx===14?'See the final reveal ❤️':'Next question →'}</button>`;document.getElementById('next').onclick=()=>{const h=document.getElementById('hint');if(h&&h.value.trim()){hints[idx]=h.value.trim().slice(0,600);void notify({event:"hint",question:idx+1,title:q.title,hint:hints[idx]})}idx++;render()}}
function finale(){const summary=questions.map((q,i)=>({question:i+1,title:q.title,answer:q.opts[answers[i]],hint:hints[i]||undefined}));void notify({event:"final",answers:summary,score:questions.reduce((s,q,i)=>s+(q.correct!==undefined&&answers[i]===q.correct?1:0),0),total:questions.filter(q=>q.correct!==undefined).length});fill.style.width='100%';sparkle(30);let score=questions.reduce((s,q,i)=>s+(q.correct!==undefined&&answers[i]===q.correct?1:0),0);let total=questions.filter(q=>q.correct!==undefined).length;let list=questions.map((q,i)=>`<div class="answer"><strong>${i+1}. ${escapeHtml(q.title)}</strong><br>${nl(q.opts[answers[i]]||'No answer')}${hints[i]?`<br><span class="muted">Hint: ${escapeHtml(hints[i])}</span>`:''}</div>`).join('');app.innerHTML=`<div class="eyebrow">Beauty's Confessions</div><h1 class="shimmer">THE FINAL REVEAL 💋</h1><div class="score-big">${score}/${total} ✨</div><p>Well, well, Beauty… you've survived all 15 questions. 😈</p><p><span class="tag">Memory score: ${score}/${total}</span></p><p>From that first “Hé Beauty!” to all our laughs, flirting and real conversations… I'm genuinely happy our paths crossed. ❤️</p><p><b>Even when you're having a bad day, you're still my Beauty.</b></p><p>And I hope our story is far from finished. 😘</p><p class="note">Piercing prediction: <b>${escapeHtml(questions[5].opts[answers[5]])}</b>. Your choice, always. ❤️</p><h2>Your answers</h2>${list}<p class="muted">Telegram sharing: ${shared?"You chose live sharing. Messages are sent as you answer.":"You chose private play. Nothing is sent."}</p><label><input type="checkbox" id="consent"> I choose to share my answers with the quiz creator, including my personal answers and any hints.</label><button class="btn" id="copy">Copy my answers ❤️</button> <button class="btn" id="again" style="margin-top:10px;background:#542442">Play again ↺</button><p id="copyStatus" class="muted" aria-live="polite"></p>`;document.getElementById('again').onclick=()=>{idx=-1;answers=[];hints={};interludeSeen={};shared=false;sessionId=null;render()};document.getElementById('copy').onclick=async()=>{if(!document.getElementById('consent').checked){document.getElementById('copyStatus').textContent='Please tick the sharing checkbox first. ❤️';return}let t=`BEAUTY'S CONFESSIONS 💋\nMemory score: ${score}/${total}\n\n`+questions.map((q,i)=>`${i+1}. ${q.title}\n${q.opts[answers[i]]}${hints[i]?`\nHint: ${hints[i]}`:''}`).join('\n\n');try{await navigator.clipboard.writeText(t);document.getElementById('copyStatus').textContent='Copied! You can paste your answers into a message. 💋'}catch{const ta=document.createElement('textarea');ta.value=t;app.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();document.getElementById('copyStatus').textContent='Copied, if supported by your browser. 💋'}}}
render();
</script></body></html>
